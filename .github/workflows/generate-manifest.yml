name: Generate manifest

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: generate-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate manifest.json
        run: python generate_manifest.py

      - name: Commit and push manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "manifest.json unchanged; nothing to commit."
          else
            git commit -m "chore: regenerate manifest.json [skip ci]"
            git push
          fi
